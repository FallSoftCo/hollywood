[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hollywood-cli"
version = "0.3.0.dev87"
description = "Durable human and agent room communication backbone"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "FallSoftCo" },
]
keywords = ["agents", "cli", "coordination", "chat", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/FallSoftCo/hollywood"
Repository = "https://github.com/FallSoftCo/hollywood"
Issues = "https://github.com/FallSoftCo/hollywood/issues"

[project.scripts]
hollywood = "hollywood:main"
hollywoodctl = "hollywoodctl:main"
hollywood-room = "hollywood_room.server:main"
hollywood-backbone = "hollywood_backbone.server:main"
hollywood-bootstrap = "hollywood_backbone.bootstrap:main"
hollywood-import-v2 = "hollywood_backbone.import_v2:main"

[project.optional-dependencies]
enterprise = ["psycopg[binary,pool]>=3.3,<4", "aiohttp>=3.12,<4", "pydantic>=2.12,<3"]
room = ["aiohttp>=3.12,<4", "pydantic>=2.12,<3", "filelock>=3.20,<4", "jsonschema>=4.26,<5"]
push = ["firebase-admin>=7,<8"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[tool.setuptools]
py-modules = ["hollywood", "hollywoodctl"]
packages = ["hollywood_room", "hollywood_backbone"]

[tool.setuptools.package-data]
hollywood_backbone = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
